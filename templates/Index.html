<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>

     <!-- Favicon & icons (one place for all pages) -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico', v=2) }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            text-align: center;
            padding-top: 20px; /* Add spacing from the top */
            transform: scale(1.2); /* Scale everything by 20% */
        }
        h1 {
            margin-bottom: 20px;
        }
        a img {
            max-width: 100%;
            height: auto;
            cursor: pointer;
            margin: 20px 0; /* Add spacing between images */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Attendance Tracker</h1>
        <div>
            <!-- Student Section -->
            <a href="/student">
                <img src="path/to/student-image.jpg" alt="Student Section">
            </a>
        </div>
        <div>
            <!-- Admin Section -->
            <a href="/admin">
                <img src="path/to/admin-image.jpg" alt="Admin Section">
            </a>
        </div>
    </div>
</body>
</html>
