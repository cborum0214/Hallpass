<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body {
            display: flex;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 300px;
            padding: 20px;
            background-color: #f4f4f4;
            position: fixed;
            top: 0;
            bottom: 0;
            overflow-y: auto;
        }

        .content {
            margin-left: 320px;
            padding: 20px;
            width: calc(100% - 320px);
            overflow-x: auto;
        }

        h1 {
            text-align: center;
        }

        form label {
            display: block;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        button, a {
            margin-top: 10px;
            display: inline-block;
            padding: 10px;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }

        button:hover, a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- Sidebar for Filters -->
    <div class="sidebar">
        <h2>Filters</h2>
        <form method="GET" action="/admin">
            <!-- Teacher Filter -->
            <label>
                <input type="checkbox" name="filter_teacher" {% if filters.teacher %}checked{% endif %}>
                Teacher:
                <select name="teacher">
                    <option value="" {% if not filters.teacher %}selected{% endif %}>All</option>
                    {% for teacher in teachers %}
                        <option value="{{ teacher }}" {% if filters.teacher == teacher %}selected{% endif %}>{{ teacher }}</option>
                    {% endfor %}
                </select>
            </label>
            
            <!-- Date Range Filter -->
            <label>
                <input type="checkbox" name="filter_date" {% if filters.date_start and filters.date_end %}checked{% endif %}>
                Date Range:
                <input type="date" name="date_start" value="{{ filters.date_start }}">
                to
                <input type="date" name="date_end" value="{{ filters.date_end }}">
            </label>

            <!-- Time Range Filter -->
            <label>
                <input type="checkbox" name="filter_time" {% if filters.time_start and filters.time_end %}checked{% endif %}>
                Time Range:
                <input type="time" name="time_start" value="{{ filters.time_start }}">
                to
                <input type="time" name="time_end" value="{{ filters.time_end }}">
            </label>

            <!-- Last Name Filter -->
            <label>
                <input type="checkbox" name="filter_last_name" {% if filters.last_name %}checked{% endif %}>
                Last Name:
                <input type="text" name="last_name" value="{{ filters.last_name }}">
            </label>

            <!-- First Name Filter -->
            <label>
                <input type="checkbox" name="filter_first_name" {% if filters.first_name %}checked{% endif %}>
                First Name:
                <input type="text" name="first_name" value="{{ filters.first_name }}">
            </label>

            <button type="submit">Apply Filters</button>
            <a href="/admin">Reset Filters</a>
        </form>
    </div>

    <!-- Content for Records -->
    <div class="content">
        <h1>Attendance Records</h1>
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Teacher</th>
                    <th>Location</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for record in records %}
                <tr>
                    <td>{{ record.timestamp }}</td>
                    <td>{{ record.last_name }}</td>
                    <td>{{ record.first_name }}</td>
                    <td>{{ record.teacher }}</td>
                    <td>{{ record.location }}</td>
                    <td>{{ record.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
