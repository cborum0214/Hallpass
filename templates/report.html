<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Report</title>
</head>
<body>
    <h1>Attendance Report</h1>
    <table border="1">
        <thead>
            <tr>
                <th>User Name</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
            {% for name, timestamp in report %}
                <tr>
                    <td>{{ name }}</td>
                    <td>{{ timestamp }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="/">Back to Home</a>
</body>
</html>
