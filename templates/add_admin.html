<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Admin</title>

     <!-- Favicon & icons (one place for all pages) -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico', v=2) }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Add New Admin</h1>
    <form method="POST" action="/admin/add_admin">
        <label for="username">New Admin Username:</label>
        <input type="text" name="username" id="username" required>

        <label for="password">New Admin Password:</label>
        <input type="password" name="password" id="password" required>

        <button type="submit">Add Admin</button>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
        {% for category, message in messages %}
          <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <a href="{{ url_for('admin') }}">Back to Admin Dashboard</a>
</body>
</html>
